<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Skim HN shows latest Hacker News submissions sorted by categories." />
        <title>Skim HN</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="shortcut icon" href="favicon.ico" />
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Skim HN</h1>
                <div class="actions">
                    <button id="add-btn" class="btn">Add</button>
                </div>
            </header>

            <main>
                <div id="grid" class="grid"></div>
            </main>

            <hr />

            <footer>
                <h3>Settings</h3>
                <p>
                    <label>
                        <input type="checkbox" id="theme-toggle" />
                        Dark theme
                    </label>
                </p>
            </footer>
        </div>

        <div id="edit-modal" class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="modal-title">Edit</h3>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <label for="edit-title">Title</label>
                    <input type="text" id="edit-title" class="input-full" />
                    <label for="edit-query">Query</label>
                    <input type="text" id="edit-query" class="input-full" />
                </div>
                <div class="modal-footer">
                    <div>
                        <button id="edit-delete" class="btn btn-danger">Delete</button>
                    </div>
                    <div class="right">
                        <button class="btn modal-cancel">Cancel</button>
                        <button id="edit-save" class="btn btn-primary">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="js/main.js"></script>
    </body>
</html>
